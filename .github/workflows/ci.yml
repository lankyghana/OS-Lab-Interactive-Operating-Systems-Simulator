name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @os-lab/engine build
      - run: pnpm --filter @os-lab/api prisma:generate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @os-lab/web build
      - run: pnpm --filter @os-lab/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
