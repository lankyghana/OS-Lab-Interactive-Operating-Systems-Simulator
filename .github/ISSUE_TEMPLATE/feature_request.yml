name: Feature or content idea
description: A new feature, a better explanation, a quiz question or a resource
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help a student do?
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations: { required: true }
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself
