name: New algorithm
description: Propose adding an algorithm or policy to a simulator
labels: [algorithm, enhancement]
body:
  - type: input
    id: name
    attributes:
      label: Algorithm
      placeholder: Highest Response Ratio Next (HRRN)
    validations: { required: true }
  - type: dropdown
    id: module
    attributes:
      label: Module
      options: [CPU Scheduling, Memory Management, Page Replacement, Disk Scheduling, Process Management, New module]
    validations: { required: true }
  - type: textarea
    id: rule
    attributes:
      label: How it decides
      description: The selection rule, tie-breaks and whether it is preemptive.
    validations: { required: true }
  - type: textarea
    id: example
    attributes:
      label: A worked example with the expected answer
      description: Cite the textbook or source. This becomes the engine test.
    validations: { required: true }
