# Render blueprint for the OS Lab API + PostgreSQL. The frontend deploys to Vercel.
services:
  - type: web
    name: os-lab-api
    runtime: node
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @os-lab/engine build && pnpm --filter @os-lab/api prisma:generate && pnpm --filter @os-lab/api build
    startCommand: pnpm --filter @os-lab/api prisma:deploy && pnpm --filter @os-lab/api start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: os-lab-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
databases:
  - name: os-lab-db
    plan: free
